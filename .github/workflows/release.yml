# Build GrabNConvert for macOS (Apple Silicon, Intel) and Windows and publish the release here.
# It runs in this public repo because GitHub-hosted runners are free for public repos; the app's
# source stays private and is checked out with a read-only deploy key (secret SOURCE_DEPLOY_KEY).
# Build logs are public; they hold compiler output, never the source or a secret.
#
#   Release:  push the tag v1.2.3 to the source repo AND to this repo. The source is built at that
#             tag; the draft release here becomes public only when all three platforms succeeded,
#             so a failed platform never reaches the update feed.
#   Test:     push a branch named test-<something> to the source repo and the same name as a tag
#             here, e.g. test-release-1.0.5: the three builds run and nothing is published.
#   Finish:   Actions tab → Run workflow with a tag (e.g. v1.0.5) runs only the last job: merge the
#             drafts, release notes, latest.json, publish. Use it when the builds succeeded and only
#             that job failed.
#
# Secrets: SOURCE_DEPLOY_KEY (read-only deploy key of the source repo), TAURI_SIGNING_PRIVATE_KEY
# (updater signing key, no password). The Supabase URL and anon key are public by design.
# Mac Developer ID (optional; without them the Mac builds stay ad-hoc signed): APPLE_CERTIFICATE
# (base64 of the .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
# APPLE_PASSWORD (an app-specific password), APPLE_TEAM_ID.

name: release

on:
  push:
    tags: ["v*", "test-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Finish this release: notes, latest.json, publish (e.g. v1.0.5)"
        required: true

permissions:
  contents: write

env:
  SOURCE_REPO: itsmonirulislam/GrabNConvert
  IS_TEST: ${{ startsWith(github.ref_name, 'test-') }}
  # A release builds the source at its own tag; a test builds the source branch of the same name.
  SOURCE_REF: ${{ startsWith(github.ref_name, 'test-') && format('refs/heads/{0}', github.ref_name) || github.ref_name }}
  VITE_SUPABASE_URL: https://ncyxewoobvahtpgbrvkc.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeXhld29vYnZhaHRwZ2JydmtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODUyODUsImV4cCI6MjEwNzI2MTI4NX0.shICZ3aca3EVKL5aI6Y0r8XRfLUqzjCTHQqEwOgcBEA

jobs:
  prepare:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - name: Draft release for the tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/${{ github.repository }}
          auth="Authorization: Bearer $GH_TOKEN"
          id=$(curl -sf -H "$auth" "$api/releases?per_page=50" | jq -r --arg t "$TAG" '[.[] | select(.tag_name == $t)][0].id // empty')
          if [ -z "$id" ]; then
            version="${TAG#v}"
            body="Installers for macOS (Apple Silicon and Intel) and Windows. Installed apps update by themselves."
            id=$(curl -sf -X POST -H "$auth" "$api/releases" -d "{\"tag_name\":\"$TAG\",\"name\":\"GrabNConvert $version\",\"body\":\"$body\",\"draft\":true,\"prerelease\":false}" | jq -r .id)
          fi
          echo "release id $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    # Runs for a release (after prepare) and for a test (prepare is skipped then).
    if: always() && github.event_name == 'push' && (needs.prepare.result == 'success' || startsWith(github.ref_name, 'test-'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            args: --config src-tauri/tauri.macos-arm64.conf.json
          - os: macos-15
            platform: macos-x64
            args: --target x86_64-apple-darwin --config src-tauri/tauri.macos-x64.conf.json
          - os: windows-latest
            platform: windows-x64
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Source (private repo, read-only key)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-x64' && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Fetch and verify media engines
        run: node scripts/prepare-engines.mjs --platform ${{ matrix.platform }}

      - name: Unit tests (frontend)
        run: npm test

      - name: Unit + end-to-end tests (Rust, real engines, no network)
        working-directory: src-tauri
        run: cargo test --lib --test ffmpeg_real --test queue_real

      # Mac: Developer ID. Tauri signs and notarises the app but leaves bundle.resources unsigned,
      # so the engines are signed here first (scripts/sign-engines.mjs in the source). The APPLE_*
      # values reach the later steps through GITHUB_ENV only when they exist: an empty one breaks
      # tauri build.
      - name: Developer ID certificate and engine signing (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "no Developer ID secrets: ad-hoc signed build"; exit 0; fi
          if [ ! -f scripts/sign-engines.mjs ]; then echo "this source has no engine signing: ad-hoc signed build"; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" -t cert || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          node scripts/sign-engines.mjs "tools/${{ matrix.platform }}"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build only (test run)
        if: env.IS_TEST == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          set -euo pipefail
          npx tauri build ${{ matrix.args }}
          ls -R src-tauri/target/release/bundle src-tauri/target/*/release/bundle 2>/dev/null | grep -E "\.(dmg|exe|tar\.gz|sig|app)$" || true

      - name: Build, sign and upload to the draft release
        if: env.IS_TEST != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          owner: itsmonirulislam
          repo: GrabNConvert-releases
          releaseId: ${{ needs.prepare.outputs.id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Tauri notarises the app inside the DMG but not the DMG itself. Apple asks for the disk image
      # to be notarised too, so each DMG goes to the notary, gets its ticket stapled, and (for a
      # release) replaces the copy tauri-action uploaded. Runs only when the Developer ID step set
      # the APPLE_* values.
      - name: Notarise the DMG (macOS)
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r dmg; do
            found=1
            echo "notarising $dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
            status=$(jq -r .status "$RUNNER_TEMP/notary.json")
            id=$(jq -r .id "$RUNNER_TEMP/notary.json")
            echo "notary $id: $status"
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              exit 1
            fi
            # Stapling fetches the ticket from Apple's CloudKit; that fetch drops now and then
            # ("The network connection was lost", exit 68), so try a few times before giving up.
            for try in 1 2 3 4 5 6; do
              if xcrun stapler staple "$dmg"; then break; fi
              [ "$try" = 6 ] && { echo "stapling failed six times"; exit 1; }
              echo "staple try $try failed, waiting 30 s"; sleep 30
            done
            spctl -a -t open --context context:primary-signature -vv "$dmg"
            echo "$dmg" >> "$RUNNER_TEMP/dmgs.txt"
          done < <(find src-tauri/target -path '*/bundle/dmg/*.dmg' -type f)
          [ "$found" = 1 ] || { echo "no DMG was built"; exit 1; }

      - name: Replace the DMG on the draft release (macOS)
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.IS_TEST != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/${{ github.repository }}
          auth="Authorization: Bearer $GH_TOKEN"
          while IFS= read -r dmg; do
            name=$(basename "$dmg")
            old=$(curl -sf -H "$auth" "$api/releases/$RELEASE_ID/assets?per_page=100" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id')
            if [ -n "$old" ]; then curl -sf -X DELETE -H "$auth" "$api/releases/assets/$old"; fi
            curl -sf -X POST -H "$auth" -H "Content-Type: application/x-apple-diskimage" --data-binary @"$dmg" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$name" > /dev/null
            echo "uploaded the notarised $name"
          done < "$RUNNER_TEMP/dmgs.txt"

  # Publishes only when every platform built. latest.json is rebuilt once from the assets that
  # are really there (the three platform jobs race on it).
  feed:
    needs: build
    if: always() && ((github.event_name == 'push' && startsWith(github.ref_name, 'v') && needs.build.result == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The scripts and CHANGELOG come from the source's main branch (the newest scripts; the
      # CHANGELOG section for this version is there too).
      - name: Source scripts (private repo, read-only key)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - name: Merge stray drafts for this tag into one (sets REL_ID)
        run: scripts/merge-drafts.sh "$TAG"

      - name: Release notes from CHANGELOG.md → release body
        run: |
          set -euo pipefail
          notes=$(node scripts/release-notes.mjs "$TAG")
          api=https://api.github.com/repos/${{ github.repository }}
          id="$REL_ID"
          jq -n --arg b "$notes" '{body: $b}' | curl -sf -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" --data-binary @- "$api/releases/$id" >/dev/null
          echo "release body set from CHANGELOG.md ($(wc -l <<<"$notes") lines)"

      - name: Rebuild latest.json from the release assets
        run: scripts/updater-feed.sh "$TAG"

      - name: Publish the release (it was a draft until every asset was in)
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/${{ github.repository }}
          jq -n --arg t "$TAG" '{tag_name: $t, draft: false, prerelease: false, make_latest: "true"}' \
            | curl -sf -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" --data-binary @- "$api/releases/$REL_ID" >/dev/null
          echo "release $TAG published (id $REL_ID)"
          curl -sfL "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" | jq -r '"update feed now says " + .version'
